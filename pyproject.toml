[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igline"
version = "1.0.0"
description = "IGLINE-PySim: Python DES port of the Arena Scenario 3 IGU production line model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "simpy>=4.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
igline = "igline.cli:main"

[tool.setuptools.packages.find]
include = ["igline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
